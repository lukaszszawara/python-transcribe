name: polskie-radio-transcription

services:
  redis:
    image: redis:7-alpine
    container_name: pr-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pr-api
    command: ["api"]
    environment:
      DATABASE_URL: sqlite:////app/data/transcription.db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_MODEL_DIR: /models
      METRICS_LOG_PATH: /app/logs/transcription_metrics.log
      WEBHOOK_LOG_PATH: /app/logs/webhook_deliveries.log
      TMP_DIR: /app/tmp
      DATA_DIR: /app/data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOW_PRIVATE_AUDIO_URLS: ${ALLOW_PRIVATE_AUDIO_URLS:-true}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - model-cache:/models
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pr-worker
    command: ["worker"]
    environment:
      DATABASE_URL: sqlite:////app/data/transcription.db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_MODEL_DIR: /models
      WHISPER_WARMUP: "1"
      WHISPER_FORCE_SINGLE_THREAD: ${WHISPER_FORCE_SINGLE_THREAD:-false}
      WORKER_MAX_TASKS_PER_CHILD: ${WORKER_MAX_TASKS_PER_CHILD:-200}
      METRICS_LOG_PATH: /app/logs/transcription_metrics.log
      WEBHOOK_LOG_PATH: /app/logs/webhook_deliveries.log
      TMP_DIR: /app/tmp
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOW_PRIVATE_AUDIO_URLS: ${ALLOW_PRIVATE_AUDIO_URLS:-true}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_MAX_RETRIES: ${WEBHOOK_MAX_RETRIES:-3}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./tmp:/app/tmp
      - model-cache:/models
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-4g}
    restart: unless-stopped

volumes:
  model-cache:
    driver: local
  redis-data:
    driver: local
